services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: azhura
      DB_USERNAME: azhura
      DB_PASSWORD: local-only-change-me
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8080:8000"
    command: sh -lc "composer install && php artisan serve --host=0.0.0.0 --port=8000"

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: azhura
      POSTGRES_USER: azhura
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azhura -d azhura"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
